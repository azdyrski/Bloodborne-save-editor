[package]
name = "bb-save-core"
version = "0.10.0"
description = "Bloodborne save editor core, compiled to WebAssembly."
authors = ["Noxde", "Valentino Amato"]
license = ""
repository = "https://github.com/Noxde/Bloodborne-save-editor"
edition = "2021"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
